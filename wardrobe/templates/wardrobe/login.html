{% extends "base.html" %}
{% block title %}Вход - Сервис учета одежды{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'wardrobe:register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
